<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <!-- Original illustrated presenter for the shorts-forge demo ("Sam", a fictional host).
       Drawn by hand for this project as vector shapes; it depicts no real person.
       MIT licensed with the rest of the repository. The class "talk" / "rest" groups are
       toggled by scripts/make_presenter.py to export the two mouth poses. -->
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eab995"/>
      <stop offset="1" stop-color="#c88a64"/>
    </linearGradient>
    <linearGradient id="neck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a86846"/>
      <stop offset=".45" stop-color="#c88a64"/>
      <stop offset="1" stop-color="#d59b75"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#46332a"/>
      <stop offset="1" stop-color="#1a1310"/>
    </linearGradient>
    <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34557f"/>
      <stop offset=".55" stop-color="#223a5e"/>
      <stop offset="1" stop-color="#14223b"/>
    </linearGradient>
    <linearGradient id="lapel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f6295"/>
      <stop offset="1" stop-color="#1c2f4f"/>
    </linearGradient>
    <linearGradient id="tee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2f36"/>
      <stop offset="1" stop-color="#17191e"/>
    </linearGradient>
    <radialGradient id="cheek" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#d9806a" stop-opacity=".42"/>
      <stop offset="1" stop-color="#d9806a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="key" cx=".25" cy=".3" r=".8">
      <stop offset="0" stop-color="#fff3e6" stop-opacity=".22"/>
      <stop offset=".6" stop-color="#fff3e6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- torso: blazer over a dark tee -->
  <path d="M36 800 C 44 660, 112 585, 222 556 L 300 590 L 378 556 C 488 585, 556 660, 564 800 Z" fill="url(#jacket)"/>
  <path d="M236 548 C 250 600, 350 600, 364 548 L 384 560 L 336 800 L 264 800 L 216 560 Z" fill="url(#tee)"/>
  <!-- lapels -->
  <path d="M222 556 L 268 700 L 252 800 L 186 800 L 164 650 Z" fill="url(#lapel)"/>
  <path d="M378 556 L 332 700 L 348 800 L 414 800 L 436 650 Z" fill="url(#lapel)"/>
  <path d="M222 556 L 268 700 L 252 800 M378 556 L 332 700 L 348 800" stroke="#0d1729" stroke-width="3" fill="none" opacity=".55"/>
  <path d="M40 800 C 48 670, 110 595, 210 563" stroke="#ffffff" stroke-opacity=".08" stroke-width="6" fill="none"/>
  <path d="M560 800 C 552 670, 490 595, 390 563" stroke="#8fd3ff" stroke-opacity=".35" stroke-width="5" fill="none"/>
  <!-- pocket square + lavalier mic -->
  <path d="M396 694 L 414 668 L 424 686 L 432 676 L 436 690 Z" fill="#ff5c39" opacity=".92"/>
  <rect x="356" y="606" width="11" height="19" rx="5" fill="#0b0b0d"/>
  <path d="M361 625 C 364 670, 352 730, 356 800" stroke="#0b0b0d" stroke-width="2" fill="none"/>

  <!-- neck -->
  <path d="M256 505 L 254 556 C 272 594, 328 594, 348 556 L 344 505 Z" fill="url(#neck)"/>

  <g transform="translate(0,66)">
    <!-- back hair -->
    <path d="M166 268 C 156 150, 228 88, 305 88 C 392 88, 450 156, 438 276 L 428 330 L 176 330 Z" fill="url(#hair)"/>

    <!-- ears -->
    <ellipse cx="182" cy="318" rx="19" ry="33" fill="#cd916d"/>
    <ellipse cx="418" cy="318" rx="19" ry="33" fill="#c08260"/>
    <path d="M186 300 C 174 310, 176 330, 188 338" stroke="#a5674a" stroke-width="4" fill="none"/>
    <path d="M414 300 C 426 310, 424 330, 412 338" stroke="#a5674a" stroke-width="4" fill="none"/>

    <!-- face -->
    <path d="M192 250 C 192 172, 240 140, 300 140 C 360 140, 408 172, 408 250
             C 408 330, 394 398, 360 436 C 340 458, 322 466, 300 466
             C 278 466, 260 458, 240 436 C 206 398, 192 330, 192 250 Z" fill="url(#skin)"/>
    <path d="M200 338 C 216 404, 256 460, 300 466 C 344 460, 384 404, 400 338
             C 380 418, 340 452, 300 455 C 260 452, 220 418, 200 338 Z" fill="#9f6244" opacity=".32"/>
    <ellipse cx="270" cy="270" rx="110" ry="150" fill="url(#key)"/>
    <path d="M405 230 C 408 310, 396 386, 360 434" stroke="#8fd3ff" stroke-opacity=".35" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- front hair: textured quiff with a side part -->
    <path d="M180 272 C 170 176, 226 108, 312 106 C 392 104, 440 160, 428 266
             C 420 222, 396 196, 352 184 C 312 174, 272 180, 244 204 C 220 224, 196 250, 180 272 Z" fill="url(#hair)"/>
    <path d="M178 262 C 182 230, 196 206, 214 196 C 204 222, 196 246, 190 270 Z" fill="#1a1310"/>
    <path d="M246 150 C 296 124, 372 132, 408 180" stroke="#6b4f40" stroke-width="5" fill="none" opacity=".55" stroke-linecap="round"/>
    <path d="M230 176 C 268 148, 330 146, 376 168" stroke="#6b4f40" stroke-width="3" fill="none" opacity=".45" stroke-linecap="round"/>
    <path d="M262 132 C 300 116, 350 118, 384 140" stroke="#7d5d4b" stroke-width="2.5" fill="none" opacity=".45" stroke-linecap="round"/>

    <!-- brows -->
    <path d="M224 258 C 240 245, 264 243, 284 250" stroke="#2a1d17" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M316 250 C 336 243, 360 245, 376 258" stroke="#2a1d17" stroke-width="9" fill="none" stroke-linecap="round"/>

    <!-- eyes -->
    <path d="M228 290 C 240 275, 266 275, 280 290 C 266 300, 242 300, 228 290 Z" fill="#fbf8f4"/>
    <path d="M320 290 C 334 275, 360 275, 372 290 C 358 300, 334 300, 320 290 Z" fill="#fbf8f4"/>
    <circle cx="255" cy="288" r="10" fill="#5a3b28"/>
    <circle cx="347" cy="288" r="10" fill="#5a3b28"/>
    <circle cx="255" cy="288" r="5" fill="#120c09"/>
    <circle cx="347" cy="288" r="5" fill="#120c09"/>
    <circle cx="259" cy="284" r="2.6" fill="#fff"/>
    <circle cx="351" cy="284" r="2.6" fill="#fff"/>
    <path d="M226 290 C 240 272, 268 272, 282 289" stroke="#22170f" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M318 289 C 332 272, 360 272, 374 290" stroke="#22170f" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M234 302 C 248 308, 264 308, 276 301" stroke="#a5674a" stroke-width="2" fill="none" opacity=".6"/>
    <path d="M324 301 C 336 308, 352 308, 366 302" stroke="#a5674a" stroke-width="2" fill="none" opacity=".6"/>

    <!-- nose -->
    <path d="M302 298 C 300 328, 296 346, 288 358 C 296 368, 312 368, 318 360" stroke="#a0603f" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse cx="300" cy="362" rx="22" ry="7" fill="#9f6244" opacity=".22"/>

    <!-- cheeks -->
    <ellipse cx="238" cy="346" rx="30" ry="18" fill="url(#cheek)"/>
    <ellipse cx="362" cy="346" rx="30" ry="18" fill="url(#cheek)"/>

    <!-- stubble -->
    <path d="M226 384 C 240 440, 272 462, 300 464 C 328 462, 360 440, 374 384 C 362 432, 330 454, 300 456 C 270 454, 238 432, 226 384 Z" fill="#3a2a22" opacity=".16"/>
    <path d="M268 384 C 286 378, 314 378, 332 384 C 316 388, 284 388, 268 384 Z" fill="#3a2a22" opacity=".18"/>

    <!-- mouth: talking pose -->
    <g class="talk">
      <path d="M264 396 C 282 408, 318 408, 336 396 C 330 426, 314 436, 300 436 C 286 436, 270 426, 264 396 Z" fill="#6e2c22"/>
      <path d="M270 399 C 286 407, 314 407, 330 399 L 328 406 C 312 413, 288 413, 272 406 Z" fill="#f6f1ea"/>
      <ellipse cx="300" cy="426" rx="18" ry="6" fill="#c45a52" opacity=".85"/>
      <path d="M260 394 C 282 406, 318 406, 340 394" stroke="#86402f" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    </g>
    <!-- mouth: resting smile -->
    <g class="rest">
      <path d="M262 398 C 282 414, 318 414, 338 398" stroke="#86402f" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M282 422 C 292 426, 308 426, 318 422" stroke="#a5674a" stroke-width="3" fill="none" opacity=".5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
